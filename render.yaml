# Render Blueprint: publica el sitio y la API Node en el mismo dominio.
services:
  - type: web
    name: jossys-berry-pty
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
